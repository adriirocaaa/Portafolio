<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7 Inicial — Vota tu alineación</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<!-- Firebase v9 compat -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

:root {
  --bg:           #0a0a0a;
  --surface:      #131313;
  --surface2:     #1c1c1c;
  --border:       #262626;
  --border2:      #333;
  --text:         #ffffff;
  --muted:        #71717a;
  --muted2:       #a1a1aa;
  --lime:         #d4ff00;
  --lime-dim:     #b5d900;
  --green:        #4ade80;
  --green-dark:   #166534;
  --pitch-light:  #2d7a4a;
  --pitch-dark:   #255f3a;
  --pitch-line:   rgba(255,255,255,0.28);
  --red:          #ef4444;
  --yellow:       #fbbf24;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== LOADING ===== */
#loading {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 999; transition: opacity .3s;
}
#loading.fade { opacity: 0; pointer-events: none; }
.spin {
  width: 36px; height: 36px;
  border: 2px solid var(--border2);
  border-top-color: var(--lime);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== TOAST ===== */
#toast {
  position: fixed; bottom: 1.75rem; left: 50%;
  transform: translateX(-50%) translateY(6px);
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 8px; padding: .65rem 1.25rem;
  font-size: .82rem; opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; z-index: 500;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.ok  { border-color: var(--green); color: var(--green); }
#toast.err { border-color: var(--red);   color: var(--red); }

/* ===== HEADER ===== */
header {
  border-bottom: 1px solid var(--border);
  padding: 1.25rem 1.75rem;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
  background: rgba(10,10,10,.85); backdrop-filter: blur(12px);
}
.hdr-left { display: flex; flex-direction: column; gap: .15rem; }
.hdr-eyebrow {
  font-family: 'Space Mono', monospace; font-size: .65rem;
  letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
.hdr-title {
  font-size: 1.35rem; font-weight: 700; letter-spacing: -.025em;
  display: flex; align-items: center; gap: .6rem;
}
.hdr-title span { color: var(--lime); }
.formation-chip {
  font-family: 'Space Mono', monospace; font-size: .6rem;
  color: var(--lime); background: rgba(212,255,0,.08);
  border: 1px solid rgba(212,255,0,.2);
  padding: .15rem .5rem; border-radius: 20px; letter-spacing: .08em;
}
.admin-btn {
  background: transparent; border: 1px solid var(--border2);
  color: var(--muted2); padding: .4rem .85rem; border-radius: 5px;
  font-family: 'Space Mono', monospace; font-size: .65rem;
  cursor: pointer; letter-spacing: .05em; transition: all .2s;
}
.admin-btn:hover { border-color: var(--lime); color: var(--lime); }

/* ===== DEMO NOTICE ===== */
.demo-notice {
  background: rgba(251,191,36,.05); border-bottom: 1px solid rgba(251,191,36,.2);
  padding: .6rem 1.75rem; display: flex; align-items: center; gap: .6rem;
  font-size: .75rem; color: rgba(251,191,36,.8);
}
.demo-notice span { font-family: 'Space Mono', monospace; font-size: .6rem;
  color: var(--yellow); background: rgba(251,191,36,.1);
  padding: .1rem .4rem; border-radius: 3px; }

/* ===== MAIN ===== */
main {
  max-width: 960px; margin: 0 auto; padding: 1.75rem 1rem 4rem;
}
.status-row {
  display: flex; align-items: center; gap: .5rem; margin-bottom: 1.5rem;
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); animation: pulse 2s infinite;
}
.dot.off { background: #444; animation: none; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.status-label {
  font-family: 'Space Mono', monospace; font-size: .62rem;
  text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
}

/* ===== VOTING LAYOUT ===== */
.voting-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2rem; align-items: start;
}
@media (max-width: 680px) {
  .voting-grid { grid-template-columns: 1fr; }
  .vote-panel { position: static !important; width: 100% !important; }
}

/* ===== PITCH ===== */
.pitch-wrap { display: flex; flex-direction: column; align-items: center; }
.pitch-hint {
  font-family: 'Space Mono', monospace; font-size: .6rem;
  color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
  margin-bottom: .65rem; align-self: flex-start;
}
.pitch {
  position: relative; width: 320px; height: 500px;
  border-radius: 6px; overflow: hidden;
  border: 2px solid rgba(255,255,255,.06);
  box-shadow: 0 0 60px rgba(45,122,74,.18), 0 24px 48px rgba(0,0,0,.6);
}
/* Alternating stripe pattern */
.pitch-bg {
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    180deg,
    var(--pitch-light) 0px, var(--pitch-light) 35px,
    var(--pitch-dark)  35px, var(--pitch-dark)  70px
  );
}
.pitch-svg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none;
}

/* ===== JERSEY POSITIONS ===== */
.jpos {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; transition: transform .18s;
  z-index: 10; user-select: none;
}
.jpos:hover { transform: translate(-50%, -50%) scale(1.12); }
.jpos svg { transition: filter .2s; }
.jpos:hover svg { filter: drop-shadow(0 0 8px rgba(74,222,128,.7)); }
.jpos .jname {
  font-size: .58rem; font-weight: 600; text-align: center;
  color: rgba(255,255,255,.92); text-shadow: 0 1px 4px rgba(0,0,0,.9);
  margin-top: 3px; max-width: 64px; line-height: 1.25;
  letter-spacing: .01em; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis;
}
.jpos .jname.empty { color: rgba(255,255,255,.42); font-style: italic; }
.jpos.voted { cursor: default; }
.jpos.voted:hover { transform: translate(-50%, -50%); }
.jpos.voted:hover svg { filter: none; }

/* ===== VOTE PANEL ===== */
.vote-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 1.4rem;
  width: 260px; position: sticky; top: 5.5rem;
}
.vp-title { font-size: .9rem; font-weight: 700; margin-bottom: 1rem; }

/* Lineup list */
.ll { list-style: none; margin-bottom: 1.25rem; }
.ll li {
  display: flex; align-items: center; gap: .5rem;
  padding: .4rem 0; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: opacity .15s;
}
.ll li:last-child { border-bottom: none; }
.ll li:hover { opacity: .7; }
.ll li.no-click { cursor: default; }
.ll li.no-click:hover { opacity: 1; }
.ll-pos {
  font-family: 'Space Mono', monospace; font-size: .58rem;
  color: var(--lime); text-transform: uppercase; min-width: 24px;
}
.ll-name { font-size: .78rem; color: var(--muted); flex: 1; }
.ll-name.filled { color: var(--text); }

/* Vote button */
.vbtn {
  width: 100%; padding: .7rem; border: none; border-radius: 5px;
  font-family: 'Space Grotesk', sans-serif; font-size: .88rem;
  font-weight: 700; cursor: pointer; transition: background .2s, color .2s;
}
.vbtn.primary { background: var(--lime); color: #0a0a0a; }
.vbtn.primary:hover:not(:disabled) { background: var(--lime-dim); }
.vbtn.primary:disabled { background: var(--border2); color: var(--muted); cursor: not-allowed; }
.vbtn.outline {
  background: transparent; border: 1px solid var(--border2);
  color: var(--muted2); margin-top: .5rem;
}
.vbtn.outline:hover { border-color: var(--lime); color: var(--lime); }
.vbtn.ghost-lime {
  background: transparent; border: 1px solid var(--lime);
  color: var(--lime); margin-top: .5rem;
}
.vbtn.ghost-lime:hover { background: rgba(212,255,0,.08); }
.hint-txt {
  text-align: center; font-size: .68rem; color: var(--muted);
  margin-top: .5rem;
}

/* Voted state */
.voted-badge {
  display: flex; align-items: center; gap: .5rem;
  background: rgba(74,222,128,.07); border: 1px solid rgba(74,222,128,.25);
  border-radius: 6px; padding: .6rem .8rem; margin-bottom: 1rem;
}
.voted-badge svg { flex-shrink: 0; }
.voted-badge p { font-size: .78rem; color: var(--green); font-weight: 600; }
.voted-badge span { font-size: .68rem; color: var(--muted); }

/* ===== MODALS ===== */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.72);
  backdrop-filter: blur(6px); z-index: 100;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.overlay.show { opacity: 1; pointer-events: all; }
.modal-box {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 12px; padding: 1.5rem; width: 360px;
  max-height: 82vh; display: flex; flex-direction: column;
  transform: translateY(10px); transition: transform .22s;
  box-shadow: 0 32px 64px rgba(0,0,0,.7);
}
.overlay.show .modal-box { transform: translateY(0); }
.modal-box.wide { width: 420px; }

.mhdr {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 1rem;
}
.mhdr-inner { display: flex; flex-direction: column; gap: .2rem; }
.mtitle { font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.mbadge {
  font-family: 'Space Mono', monospace; font-size: .62rem;
  color: var(--lime); background: rgba(212,255,0,.09);
  padding: .15rem .45rem; border-radius: 4px; align-self: flex-start;
}
.mclose {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 1.1rem; padding: .2rem; border-radius: 4px;
  transition: color .15s; line-height: 1;
}
.mclose:hover { color: var(--text); }

.msearch {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 6px; padding: .55rem .75rem; color: var(--text);
  font-family: 'Space Grotesk', sans-serif; font-size: .84rem;
  margin-bottom: .6rem; outline: none; transition: border-color .2s;
}
.msearch:focus { border-color: var(--lime); }
.mplayers { overflow-y: auto; flex: 1; padding-right: 2px; }
.mplayers::-webkit-scrollbar { width: 4px; }
.mplayers::-webkit-scrollbar-track { background: transparent; }
.mplayers::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.p-opt {
  display: flex; align-items: center; gap: .65rem;
  padding: .55rem .65rem; border-radius: 6px;
  cursor: pointer; transition: background .14s;
}
.p-opt:hover:not(.used) { background: var(--surface2); }
.p-opt.active { background: rgba(74,222,128,.1); }
.p-opt.used { opacity: .38; cursor: not-allowed; }
.p-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--border2); display: flex; align-items: center;
  justify-content: center; font-size: .68rem; font-weight: 700;
  color: var(--muted2); flex-shrink: 0;
}
.p-opt.active .p-avatar { background: var(--green); color: #0a0a0a; }
.p-pname { font-size: .82rem; flex: 1; }
.p-check { color: var(--green); font-size: .8rem; }
.p-used-lbl { font-size: .62rem; color: var(--muted); }
.mno-results { font-size: .8rem; color: var(--muted); padding: .5rem .65rem; }

/* Admin panel */
.form-grp { margin-bottom: 1rem; }
.form-lbl {
  display: block; font-family: 'Space Mono', monospace; font-size: .62rem;
  color: var(--muted); letter-spacing: .06em; margin-bottom: .3rem;
  text-transform: uppercase;
}
.form-inp {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 5px; padding: .6rem .75rem; color: var(--text);
  font-family: 'Space Grotesk', sans-serif; font-size: .9rem; outline: none;
  transition: border-color .2s;
}
.form-inp:focus { border-color: var(--lime); }
.err-msg { font-size: .75rem; color: var(--red); margin-top: .35rem; display: none; }
.row-btns { display: flex; gap: .5rem; margin-top: 1.1rem; }
.btn {
  padding: .55rem 1.1rem; border-radius: 5px; border: none;
  font-family: 'Space Grotesk', sans-serif; font-size: .84rem;
  font-weight: 600; cursor: pointer; transition: all .18s;
}
.btn.lime  { background: var(--lime); color: #0a0a0a; }
.btn.lime:hover { background: var(--lime-dim); }
.btn.red   { background: var(--red); color: #fff; }
.btn.red:hover { background: #dc2626; }
.btn.ghost { background: transparent; border: 1px solid var(--border2); color: var(--muted2); }
.btn.ghost:hover { border-color: var(--muted2); color: var(--text); }

.stat-box {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 7px; padding: .85rem 1rem; margin-bottom: 1rem;
}
.stat-num { font-size: 2rem; font-weight: 700; line-height: 1; }
.stat-lbl { font-family: 'Space Mono', monospace; font-size: .62rem; color: var(--muted); margin-top: .2rem; }
.status-inl { display: flex; align-items: center; gap: .45rem; }

.danger-box {
  border: 1px solid rgba(239,68,68,.35); border-radius: 7px;
  padding: .85rem 1rem; margin-bottom: 1rem;
}
.danger-box p { font-size: .78rem; color: var(--muted2); margin-bottom: .75rem; line-height: 1.5; }
.success-box {
  border: 1px solid rgba(74,222,128,.3); border-radius: 7px;
  padding: .85rem 1rem; margin-bottom: 1rem;
}
.success-box p { font-size: .78rem; color: var(--green); margin-bottom: .75rem; }

/* ===== RESULTS VIEW ===== */
.results-view { max-width: 680px; margin: 0 auto; padding: 1.75rem 0 4rem; }
.results-closed {
  background: rgba(74,222,128,.04); border: 1px solid rgba(74,222,128,.2);
  border-radius: 8px; padding: 1rem 1.4rem; margin-bottom: 1.75rem;
  text-align: center;
}
.results-closed h2 { font-size: .9rem; color: var(--green); margin-bottom: .2rem; }
.results-closed p { font-size: .75rem; color: var(--muted); }

.results-hdr { margin-bottom: 1.75rem; }
.results-hdr h1 {
  font-size: 2.2rem; font-weight: 700; letter-spacing: -.04em; margin-bottom: .3rem;
}
.results-hdr h1 em { color: var(--lime); font-style: normal; }
.results-hdr p { font-size: .8rem; color: var(--muted); }

.pos-result {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 9px; padding: 1.2rem 1.25rem; margin-bottom: .85rem;
}
.pr-hdr {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: .75rem;
}
.pr-pos-name {
  font-family: 'Space Mono', monospace; font-size: .65rem;
  color: var(--lime); text-transform: uppercase; letter-spacing: .1em;
}
.pr-count { font-family: 'Space Mono', monospace; font-size: .62rem; color: var(--muted); }
.winner-row { display: flex; align-items: baseline; gap: .65rem; margin-bottom: .4rem; }
.winner-name { font-size: 1.05rem; font-weight: 700; flex: 1; }
.winner-pct { font-family: 'Space Mono', monospace; font-size: .95rem; font-weight: 700; color: var(--lime); }
.bar { height: 4px; background: var(--border2); border-radius: 2px; overflow: hidden; margin-bottom: .7rem; }
.bar-fill { height: 100%; border-radius: 2px; transition: width .7s cubic-bezier(.4,0,.2,1); }
.bar-fill.win { background: var(--lime); }
.bar-fill.sub { background: #4b5563; }
.runners { display: flex; flex-direction: column; gap: .35rem; }
.runner-row { display: flex; align-items: center; gap: .5rem; }
.runner-name { font-size: .78rem; color: var(--muted2); flex: 1; }
.runner-pct { font-family: 'Space Mono', monospace; font-size: .7rem; color: var(--muted); }
.tie-badge {
  font-family: 'Space Mono', monospace; font-size: .6rem;
  color: var(--yellow); background: rgba(251,191,36,.1);
  padding: .1rem .4rem; border-radius: 3px; margin-left: .3rem;
}

.results-pitch-section { margin: 2.5rem 0 1rem; }
.results-pitch-section h3 {
  font-size: .75rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .1em; color: var(--muted); margin-bottom: 1rem;
  font-family: 'Space Mono', monospace;
}
.results-pitch-outer { display: flex; justify-content: center; }
.results-pitch {
  position: relative; width: 280px; height: 430px;
  border-radius: 6px; overflow: hidden;
  border: 2px solid rgba(255,255,255,.06);
  box-shadow: 0 0 40px rgba(45,122,74,.12);
}

/* ===== CLOSED VOTING ===== */
.voting-closed-screen {
  max-width: 500px; margin: 4rem auto; text-align: center; padding: 2rem;
}
.voting-closed-screen h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: .5rem; }
.voting-closed-screen p { font-size: .85rem; color: var(--muted); margin-bottom: 1.5rem; }
</style>
</head>
<body>

<div id="loading"><div class="spin"></div></div>
<div id="toast"></div>

<!-- HEADER -->
<header>
  <div class="hdr-left">
    <span class="hdr-eyebrow">Fútbol 7 · Temporada 2025</span>
    <div class="hdr-title">7 <span>Inicial</span> <span class="formation-chip">2-3-1</span></div>
  </div>
  <button class="admin-btn" onclick="openAdmin()">⚙ Admin</button>
</header>

<!-- DEMO NOTICE (shown when Firebase not configured) -->
<div class="demo-notice" id="demoNotice" style="display:none">
  <span>DEMO</span>
  Los votos se guardan solo en este dispositivo. Configura Firebase para habilitar votación real entre múltiples personas.
</div>

<!-- MAIN APP ROOT -->
<div id="root"></div>

<!-- PLAYER SELECTION MODAL -->
<div class="overlay" id="playerOverlay" onclick="overlayClick(event,'playerOverlay')">
  <div class="modal-box">
    <div class="mhdr">
      <div class="mhdr-inner">
        <div class="mtitle" id="mTitle">Selecciona jugador</div>
        <div class="mbadge" id="mBadge">POS</div>
      </div>
      <button class="mclose" onclick="closePlayer()">✕</button>
    </div>
    <input class="msearch" id="msearch" placeholder="Buscar jugador..." oninput="filterPlayers()">
    <div class="mplayers" id="mplayers"></div>
  </div>
</div>

<!-- ADMIN MODAL -->
<div class="overlay" id="adminOverlay" onclick="overlayClick(event,'adminOverlay')">
  <div class="modal-box wide">
    <div class="mhdr" style="margin-bottom:1.25rem">
      <div class="mtitle">Panel de Administrador</div>
      <button class="mclose" onclick="closeAdmin()">✕</button>
    </div>
    <div id="adminBody"></div>
  </div>
</div>

<script>
/* ================================================================
   CONFIGURATION — EDITA AQUÍ
   ================================================================ */

// Lista de jugadores del equipo
const PLAYERS = [
  "Alejandro García",
  "Carlos Martínez",
  "David López",
  "Enrique Rodríguez",
  "Fernando Sánchez",
  "Gonzalo Pérez",
  "Hugo González",
  "Iván Torres",
  "Javier Ruiz",
  "Kevin Jiménez",
  "Luis Moreno",
  "Manuel Díaz",
  "Nicolás Hernández",
  "Oscar Fernández",
  "Pablo García",
  "Rafael Muñoz",
  "Sergio Álvarez",
  "Tomás Romero",
  "Víctor Castillo"
];

// Firebase — Crea un proyecto en https://console.firebase.google.com,
// activa Firestore y pega aquí tu configuración.
const FIREBASE_CONFIG = {
  apiKey:            "",
  authDomain:        "",
  projectId:         "",
  storageBucket:     "",
  messagingSenderId: "",
  appId:             ""
};

// Contraseña de administrador
const ADMIN_PASSWORD = "CRQT";

/* ================================================================
   POSICIONES (formación 2-3-1, eje Y: 0=arriba, 100=abajo)
   ================================================================ */
const POSITIONS = [
  { id:"portero",      label:"PT", name:"Portero",         x:50, y:87, gk:true,  num:1 },
  { id:"defensa_izq",  label:"DF", name:"Def. Izquierdo",  x:26, y:67, num:2 },
  { id:"defensa_der",  label:"DF", name:"Def. Derecho",    x:74, y:67, num:3 },
  { id:"medio_izq",    label:"MC", name:"Medio Izq.",      x:14, y:46, num:4 },
  { id:"medio_cen",    label:"MC", name:"Medio Centro",    x:50, y:43, num:5 },
  { id:"medio_der",    label:"MC", name:"Medio Der.",      x:86, y:46, num:6 },
  { id:"delantero",    label:"DL", name:"Delantero",       x:50, y:17, num:7 },
];

/* ================================================================
   STATE
   ================================================================ */
const state = {
  votingActive: true,
  hasVoted: false,
  editing: false,
  adminAuthed: false,
  vote: {},          // { portero: "Nombre", ... }
  selectedPos: null,
};

// Unique voter ID per browser
let VOTER_ID = localStorage.getItem("__lineup_vid");
if (!VOTER_ID) {
  VOTER_ID = "v_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);
  localStorage.setItem("__lineup_vid", VOTER_ID);
}

/* ================================================================
   FIREBASE / LOCAL FALLBACK
   ================================================================ */
let db = null;
let localMode = false;

function initFirebase() {
  if (!FIREBASE_CONFIG.apiKey) { localMode = true; return; }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  } catch(e) {
    localMode = true;
  }
}

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function lsSet(k,v) { localStorage.setItem(k, JSON.stringify(v)); }

async function dbGetStatus() {
  if (localMode) return lsGet("__lineup_status") || { active: true };
  const d = await db.collection("config").doc("status").get();
  return d.exists ? d.data() : { active: true };
}

async function dbSetStatus(active) {
  if (localMode) {
    lsSet("__lineup_status", { active, endedAt: new Date().toISOString() });
    return;
  }
  await db.collection("config").doc("status").set({
    active,
    endedAt: active ? null : firebase.firestore.FieldValue.serverTimestamp()
  });
}

async function dbGetMyVote() {
  if (localMode) return lsGet("__lineup_myvote_" + VOTER_ID);
  const d = await db.collection("votes").doc(VOTER_ID).get();
  return d.exists ? d.data() : null;
}

async function dbSaveVote(voteObj) {
  const data = { ...voteObj, ts: new Date().toISOString() };
  if (localMode) {
    const all = lsGet("__lineup_allvotes") || {};
    all[VOTER_ID] = data;
    lsSet("__lineup_allvotes", all);
    lsSet("__lineup_myvote_" + VOTER_ID, data);
    return;
  }
  await db.collection("votes").doc(VOTER_ID).set(data);
}

async function dbGetAllVotes() {
  if (localMode) {
    const all = lsGet("__lineup_allvotes") || {};
    return Object.values(all);
  }
  const snap = await db.collection("votes").get();
  return snap.docs.map(d => d.data());
}

async function dbGetCount() {
  if (localMode) {
    const all = lsGet("__lineup_allvotes") || {};
    return Object.keys(all).length;
  }
  const snap = await db.collection("votes").get();
  return snap.size;
}

/* ================================================================
   RESULTS CALC
   ================================================================ */
function calcResults(votes) {
  const r = {};
  POSITIONS.forEach(p => r[p.id] = {});
  votes.forEach(v => {
    POSITIONS.forEach(p => {
      if (v[p.id]) r[p.id][v[p.id]] = (r[p.id][v[p.id]] || 0) + 1;
    });
  });
  const out = {};
  POSITIONS.forEach(p => {
    out[p.id] = Object.entries(r[p.id]).sort((a,b) => b[1]-a[1]);
  });
  return out;
}

/* ================================================================
   JERSEY SVG
   ================================================================ */
function jerseyPath(fill, stroke) {
  return `<svg width="52" height="48" viewBox="0 0 60 56" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M23 6 C21 1 39 1 37 6 L50 11 L58 20 L50 24 L50 52 L10 52 L10 24 L2 20 L10 11 Z"
      fill="${fill}" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>`;
}

function posJersey(pos, playerName) {
  const selected = !!playerName;
  const fill   = pos.gk  ? "#fbbf24" : (selected ? "#ffffff" : "#d1d5db");
  const stroke = pos.gk  ? "#d97706" : (selected ? "#4ade80" : "#6b7280");
  const numCol = pos.gk  ? "#92400e" : "#1a1a1a";
  const canEdit = !state.hasVoted || state.editing;

  return `<div class="jpos${!canEdit ? ' voted':''}"
    style="left:${pos.x}%;top:${pos.y}%"
    onclick="${canEdit ? `pickPos('${pos.id}')` : ''}"
    title="${pos.name}">
    <div style="position:relative;width:52px;height:48px">
      ${jerseyPath(fill, stroke)}
      <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-44%);
        font-family:'Space Mono',monospace;font-weight:700;font-size:12px;
        color:${numCol};pointer-events:none">${pos.num}</span>
    </div>
    <span class="jname${playerName ? '' : ' empty'}">
      ${playerName ? firstName(playerName) : pos.name}
    </span>
  </div>`;
}

function firstName(fullName) {
  const parts = fullName.split(" ");
  return parts[0];
}

/* ================================================================
   PITCH SVG LINES
   ================================================================ */
function pitchLines(w, h) {
  const s = `<svg class="pitch-svg" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"
    fill="none" stroke="${'rgba(255,255,255,0.28)'}" stroke-width="1.5">
    <!-- border -->
    <rect x="12" y="12" width="${w-24}" height="${h-24}"/>
    <!-- halfway line -->
    <line x1="12" y1="${h/2}" x2="${w-12}" y2="${h/2}"/>
    <!-- center circle -->
    <circle cx="${w/2}" cy="${h/2}" r="${w*0.14}" />
    <circle cx="${w/2}" cy="${h/2}" r="2.5" fill="rgba(255,255,255,.3)"/>
    <!-- penalty area top -->
    <rect x="${w*0.22}" y="12" width="${w*0.56}" height="${h*0.18}"/>
    <!-- goal area top -->
    <rect x="${w*0.34}" y="12" width="${w*0.32}" height="${h*0.08}"/>
    <!-- penalty area bottom -->
    <rect x="${w*0.22}" y="${h-12-h*0.18}" width="${w*0.56}" height="${h*0.18}"/>
    <!-- goal area bottom -->
    <rect x="${w*0.34}" y="${h-12-h*0.08}" width="${w*0.32}" height="${h*0.08}"/>
    <!-- penalty spots -->
    <circle cx="${w/2}" cy="${h*0.16}" r="2.5" fill="rgba(255,255,255,.3)" stroke="none"/>
    <circle cx="${w/2}" cy="${h*0.84}" r="2.5" fill="rgba(255,255,255,.3)" stroke="none"/>
  </svg>`;
  return s;
}

/* ================================================================
   RENDER
   ================================================================ */
function render() {
  const root = document.getElementById("root");

  if (!state.votingActive) {
    root.innerHTML = renderResults();
    loadAndShowResults();
    return;
  }

  const allFilled = POSITIONS.every(p => state.vote[p.id]);

  root.innerHTML = `
  <main>
    <div class="status-row">
      <div class="dot"></div>
      <span class="status-label">Votación abierta</span>
    </div>
    <div class="voting-grid">
      <!-- PITCH -->
      <div class="pitch-wrap">
        <p class="pitch-hint">Toca una posición para elegir jugador</p>
        <div class="pitch">
          <div class="pitch-bg"></div>
          ${pitchLines(320,500)}
          ${POSITIONS.map(p => posJersey(p, state.vote[p.id])).join("")}
        </div>
      </div>

      <!-- VOTE PANEL -->
      <div class="vote-panel">
        ${state.hasVoted && !state.editing ? `
          <div class="voted-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            <div><p>Voto enviado</p><span>Tu alineación ha sido registrada</span></div>
          </div>
        ` : `<div class="vp-title">Tu alineación</div>`}

        <ul class="ll">
          ${POSITIONS.map(p => `
            <li class="${state.hasVoted && !state.editing ? 'no-click' : ''}"
                onclick="${state.hasVoted && !state.editing ? '' : `pickPos('${p.id}')`}">
              <span class="ll-pos">${p.label}</span>
              <span class="ll-name ${state.vote[p.id] ? 'filled' : ''}">
                ${state.vote[p.id] || "— sin seleccionar"}
              </span>
            </li>
          `).join("")}
        </ul>

        ${state.hasVoted && !state.editing ? `
          <button class="vbtn ghost-lime" onclick="startEdit()">Editar voto</button>
        ` : `
          <button class="vbtn primary" ${allFilled ? '' : 'disabled'} onclick="submitVote()">
            ${state.editing ? "Guardar cambios" : "Votar"}
          </button>
          ${state.editing ? `<button class="vbtn outline" onclick="cancelEdit()">Cancelar</button>` : ""}
          ${!allFilled ? `<p class="hint-txt">Selecciona los ${POSITIONS.length} jugadores</p>` : ""}
        `}
      </div>
    </div>
  </main>`;
}

function renderResults() {
  return `
  <main>
    <div class="results-view">
      <div class="results-closed">
        <h2>Votación finalizada</h2>
        <p>Resultados oficiales del 7 Inicial</p>
      </div>
      <div class="results-hdr">
        <h1>7 <em>Inicial</em></h1>
        <p id="rSummary">Cargando resultados…</p>
      </div>
      <div id="rContent"><p style="color:var(--muted);padding:2rem 0">Cargando…</p></div>

      <div class="results-pitch-section">
        <h3>Alineación ganadora</h3>
        <div class="results-pitch-outer">
          <div class="results-pitch" id="rPitch">
            <div class="pitch-bg"></div>
            ${pitchLines(280,430)}
          </div>
        </div>
      </div>
    </div>
  </main>`;
}

async function loadAndShowResults() {
  try {
    const votes  = await dbGetAllVotes();
    const total  = votes.length;
    const res    = calcResults(votes);

    document.getElementById("rSummary").textContent =
      `${total} voto${total !== 1 ? "s" : ""} registrado${total !== 1 ? "s" : ""}`;

    const html = POSITIONS.map(pos => {
      const list = res[pos.id] || [];
      if (!list.length) return `
        <div class="pos-result">
          <div class="pr-hdr">
            <span class="pr-pos-name">${pos.name}</span>
          </div>
          <p style="font-size:.78rem;color:var(--muted)">Sin votos registrados</p>
        </div>`;

      const [winner, wCount] = list[0];
      const wPct = total > 0 ? Math.round((wCount / total) * 100) : 0;
      const runners = list.slice(1, 4);
      const isTie = list.length > 1 && list[1][1] === wCount;

      return `<div class="pos-result">
        <div class="pr-hdr">
          <span class="pr-pos-name">${pos.name}</span>
          <span class="pr-count">${wCount} / ${total} votos</span>
        </div>
        <div class="winner-row">
          <span class="winner-name">${winner}${isTie ? `<span class="tie-badge">EMPATE</span>` : ""}</span>
          <span class="winner-pct">${wPct}%</span>
        </div>
        <div class="bar"><div class="bar-fill win" style="width:${wPct}%"></div></div>
        ${runners.length ? `<div class="runners">
          ${runners.map(([name, cnt]) => {
            const pct = Math.round((cnt / total) * 100);
            return `<div>
              <div class="runner-row">
                <span class="runner-name">${name}</span>
                <span class="runner-pct">${pct}%</span>
              </div>
              <div class="bar" style="height:3px">
                <div class="bar-fill sub" style="width:${pct}%"></div>
              </div>
            </div>`;
          }).join("")}
        </div>` : ""}
      </div>`;
    }).join("");

    document.getElementById("rContent").innerHTML = html;

    // Build winning pitch
    const rPitch = document.getElementById("rPitch");
    if (rPitch) {
      POSITIONS.forEach(pos => {
        const winner = res[pos.id]?.[0]?.[0] || null;
        const div = document.createElement("div");
        div.innerHTML = posJerseyResult(pos, winner, 280, 430);
        rPitch.appendChild(div.firstElementChild);
      });
    }
  } catch(e) {
    console.error(e);
    document.getElementById("rContent").innerHTML =
      '<p style="color:var(--muted)">Error al cargar resultados</p>';
  }
}

function posJerseyResult(pos, playerName, w, h) {
  const selected = !!playerName;
  const fill   = pos.gk ? "#fbbf24" : (selected ? "#ffffff" : "#6b7280");
  const stroke = pos.gk ? "#d97706" : (selected ? "#4ade80" : "#4b5563");
  const numCol = pos.gk ? "#92400e" : "#1a1a1a";

  return `<div class="jpos voted" style="left:${pos.x}%;top:${pos.y}%;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:10">
    <div style="position:relative;width:40px;height:37px">
      <svg width="40" height="37" viewBox="0 0 60 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M23 6 C21 1 39 1 37 6 L50 11 L58 20 L50 24 L50 52 L10 52 L10 24 L2 20 L10 11 Z"
          fill="${fill}" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-44%);
        font-family:'Space Mono',monospace;font-weight:700;font-size:10px;
        color:${numCol};pointer-events:none">${pos.num}</span>
    </div>
    <span style="font-size:.5rem;font-weight:600;text-align:center;color:rgba(255,255,255,.88);
      text-shadow:0 1px 4px rgba(0,0,0,.9);margin-top:2px;max-width:56px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
      ${playerName ? firstName(playerName) : "—"}
    </span>
  </div>`;
}

/* ================================================================
   PLAYER MODAL
   ================================================================ */
function pickPos(posId) {
  if (state.hasVoted && !state.editing) return;
  state.selectedPos = posId;
  const pos = POSITIONS.find(p => p.id === posId);
  document.getElementById("mTitle").textContent = pos.name;
  document.getElementById("mBadge").textContent = pos.label;
  document.getElementById("msearch").value = "";
  renderPlayerOpts("");
  show("playerOverlay");
  setTimeout(() => document.getElementById("msearch").focus(), 80);
}

function closePlayer() { hide("playerOverlay"); state.selectedPos = null; }

function filterPlayers() {
  renderPlayerOpts(document.getElementById("msearch").value);
}

function renderPlayerOpts(q) {
  const query = q.toLowerCase();
  const used = new Set(
    Object.entries(state.vote)
      .filter(([k]) => k !== state.selectedPos)
      .map(([,v]) => v)
  );
  const current = state.vote[state.selectedPos];
  const list = PLAYERS.filter(p => p.toLowerCase().includes(query));

  if (!list.length) {
    document.getElementById("mplayers").innerHTML =
      `<div class="mno-results">Sin resultados para "${q}"</div>`;
    return;
  }

  document.getElementById("mplayers").innerHTML = list.map(p => {
    const isActive = p === current;
    const isUsed   = used.has(p);
    const ini = p.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
    return `<div class="p-opt ${isActive ? 'active':''} ${isUsed ? 'used':''}"
      onclick="${isUsed && !isActive ? '' : `choosePlayer('${p.replace(/'/g,"\\'")}')`}">
      <div class="p-avatar">${ini}</div>
      <span class="p-pname">${p}</span>
      ${isActive ? '<span class="p-check">✓</span>' : ''}
      ${isUsed && !isActive ? '<span class="p-used-lbl">en uso</span>' : ''}
    </div>`;
  }).join("");
}

function choosePlayer(name) {
  if (!state.selectedPos) return;
  state.vote[state.selectedPos] = name;
  hide("playerOverlay");
  state.selectedPos = null;
  render();
}

/* ================================================================
   VOTE ACTIONS
   ================================================================ */
async function submitVote() {
  if (!POSITIONS.every(p => state.vote[p.id])) return;
  try {
    await dbSaveVote({ ...state.vote });
    state.hasVoted = true;
    state.editing  = false;
    toast("¡Voto enviado correctamente!", "ok");
    render();
  } catch(e) {
    toast("Error al enviar el voto", "err");
    console.error(e);
  }
}

function startEdit() { state.editing = true; render(); }

function cancelEdit() {
  state.editing = false;
  // Restore original saved vote
  dbGetMyVote().then(v => {
    if (v) {
      state.vote = { ...v };
      delete state.vote.ts;
    }
    render();
  });
}

/* ================================================================
   ADMIN PANEL
   ================================================================ */
function openAdmin() {
  renderAdmin();
  show("adminOverlay");
}
function closeAdmin() { hide("adminOverlay"); }

function renderAdmin() {
  const body = document.getElementById("adminBody");
  if (!state.adminAuthed) {
    body.innerHTML = `
      <div class="form-grp">
        <label class="form-lbl">Contraseña</label>
        <input class="form-inp" type="password" id="aPass" placeholder="••••"
          onkeydown="if(event.key==='Enter')checkPass()">
        <div class="err-msg" id="aErr">Contraseña incorrecta</div>
      </div>
      <div class="row-btns">
        <button class="btn lime" onclick="checkPass()">Acceder</button>
        <button class="btn ghost" onclick="closeAdmin()">Cancelar</button>
      </div>`;
    setTimeout(() => document.getElementById("aPass")?.focus(), 80);
    return;
  }

  dbGetCount().then(count => {
    body.innerHTML = `
      <div class="stat-box">
        <div class="stat-num">${count}</div>
        <div class="stat-lbl">Votos totales registrados</div>
      </div>
      <div class="stat-box" style="margin-bottom:1.25rem">
        <div class="stat-lbl" style="margin-bottom:.35rem">Estado de la votación</div>
        <div class="status-inl">
          <div class="dot ${state.votingActive ? '' : 'off'}"></div>
          <span style="font-size:.85rem">${state.votingActive ? "Abierta" : "Cerrada"}</span>
        </div>
      </div>

      ${state.votingActive ? `
      <div class="danger-box">
        <p>Al cerrar la votación se mostrarán los resultados finales a todos los usuarios.
           Esta acción <strong>no se puede deshacer</strong>.</p>
        <button class="btn red" onclick="endVoting()">Cerrar votación y publicar resultados</button>
      </div>` : `
      <div class="success-box">
        <p>La votación está cerrada. Los resultados son visibles.</p>
        <button class="btn lime" onclick="closeAdmin();render()">Ver resultados</button>
      </div>`}

      <div style="text-align:right;margin-top:.5rem">
        <button class="btn ghost" onclick="state.adminAuthed=false;renderAdmin()">Cerrar sesión</button>
      </div>`;
  });
}

function checkPass() {
  const v = document.getElementById("aPass")?.value;
  if (v === ADMIN_PASSWORD) {
    state.adminAuthed = true;
    renderAdmin();
  } else {
    const el = document.getElementById("aErr");
    if (el) el.style.display = "block";
  }
}

async function endVoting() {
  if (!confirm("¿Cerrar la votación? Esta acción no se puede deshacer.")) return;
  try {
    await dbSetStatus(false);
    state.votingActive = false;
    closeAdmin();
    render();
    toast("Votación cerrada", "ok");
  } catch(e) {
    toast("Error al cerrar la votación", "err");
    console.error(e);
  }
}

/* ================================================================
   UTILS
   ================================================================ */
function show(id) { document.getElementById(id).classList.add("show"); }
function hide(id) { document.getElementById(id).classList.remove("show"); }

function overlayClick(e, id) {
  if (e.target === document.getElementById(id)) hide(id);
}

let toastTimer;
function toast(msg, type="ok") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}

/* ================================================================
   INIT
   ================================================================ */
async function init() {
  initFirebase();

  if (localMode) {
    document.getElementById("demoNotice").style.display = "flex";
  }

  try {
    const status = await dbGetStatus();
    state.votingActive = status.active !== false;

    if (state.votingActive) {
      const myVote = await dbGetMyVote();
      if (myVote) {
        state.hasVoted = true;
        // Copy vote fields only (not ts)
        POSITIONS.forEach(p => {
          if (myVote[p.id]) state.vote[p.id] = myVote[p.id];
        });
      }
    }
  } catch(e) {
    console.error("Init error:", e);
  }

  const ld = document.getElementById("loading");
  ld.classList.add("fade");
  setTimeout(() => ld.remove(), 350);

  render();
}

init();
</script>
</body>
</html>
